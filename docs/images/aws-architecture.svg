<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="title description">
  <title id="title">The Blue Veil — AWS architecture</title>
  <desc id="description">The browser connects through CloudFront and WAF. Private S3 serves the game through Origin Access Control. Uncached API requests reach API Gateway and Lambda in Thailand, protected by an origin authorizer. The API stores sessions, quotas, reading state, transactional outbox records and content in two DynamoDB tables. DynamoDB Streams triggers a Lambda dispatcher, which sends reading IDs to SQS. A Lambda worker calls Amazon Bedrock through a US inference profile, checking input and output with Guardrails, then saves the reading in DynamoDB. The browser polls the API for the result. EventBridge and a Lambda reconciler recover pending work and clean expired content; failed queue jobs go to a dead-letter queue. Secrets Manager, scoped IAM, CloudWatch, SNS and budget alerts support security and operations.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10142a"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="0">
      <stop stop-color="#183451"/>
      <stop offset="1" stop-color="#18283d"/>
    </linearGradient>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#77cbf5"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#b9a0fa"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #f5f3ff; font-size: 27px; font-weight: 650; }
      .body { fill: #c8d3e5; font-size: 22px; }
      .small { fill: #a8b8d1; font-size: 20px; }
      .eyebrow { fill: #91a9c8; font-size: 19px; font-weight: 650; letter-spacing: 2px; }
      .service { fill: #152237; stroke: #425a76; stroke-width: 1.5; }
      .request { fill: none; stroke: #77cbf5; stroke-width: 3; stroke-linejoin: round; marker-end: url(#blue-arrow); }
      .async { fill: none; stroke: #b9a0fa; stroke-width: 3; stroke-linejoin: round; marker-end: url(#purple-arrow); }
      .step { fill: #101528; font-size: 20px; font-weight: 750; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1440" height="1500" rx="24" fill="url(#background)"/>
  <path d="M42 129h1356" stroke="#344363"/>
  <text x="48" y="57" class="eyebrow" fill="#b2a1ed">THE BLUE VEIL</text>
  <text x="46" y="103" fill="#f7f5ff" font-size="43" font-weight="700">AWS architecture</text>
  <text x="670" y="68" class="body">A serverless tarot game</text>
  <text x="670" y="103" class="small">Cached scenes. Queued readings. Browser-owned sessions.</text>

  <!-- Delivery: cached static files and an uncached, same-origin API. -->
  <rect x="40" y="158" width="1360" height="237" rx="18" fill="#111e31" stroke="#335675"/>
  <text x="68" y="197" class="eyebrow">01 / GLOBAL DELIVERY</text>
  <text x="1070" y="197" class="small">HTTPS · same-origin requests</text>

  <rect x="68" y="240" width="254" height="116" rx="12" class="service"/>
  <text x="91" y="279" class="heading">Player browser</text>
  <text x="91" y="311" class="body">TypeScript + WebGL</text>
  <text x="91" y="339" class="small">No AWS credentials</text>

  <path d="M322 296h99" class="request" marker-start="url(#blue-arrow)"/>
  <text x="344" y="276" class="small">HTTPS</text>

  <rect x="421" y="226" width="444" height="144" rx="12" fill="url(#edge)" stroke="#69bce6" stroke-width="1.5"/>
  <text x="446" y="266" class="heading">CloudFront + AWS WAF</text>
  <text x="446" y="301" class="body">CDN cache and request rate limits</text>
  <text x="446" y="334" class="small">Edge functions: headers + trusted network</text>

  <path d="M865 296h101" class="request" marker-start="url(#blue-arrow)"/>
  <text x="892" y="276" class="small">OAC</text>

  <rect x="966" y="240" width="404" height="116" rx="12" class="service"/>
  <text x="990" y="279" class="heading">Amazon S3</text>
  <text x="990" y="311" class="body">Private game files and assets</text>
  <text x="990" y="339" class="small">Signed origin access · us-east-1</text>

  <!-- Public HTTP API origin, authenticated through the edge origin secret. -->
  <rect x="40" y="444" width="1360" height="554" rx="18" fill="#121b2d" stroke="#4c5479"/>
  <text x="68" y="483" class="eyebrow">02 / THAILAND BACKEND</text>
  <text x="1199" y="483" class="small">ap-southeast-7</text>
  <path d="M642 370v128H263v20" class="request" marker-start="url(#blue-arrow)"/>
  <text x="675" y="425" class="small">Uncached /api/* · origin-secret check</text>

  <rect x="68" y="518" width="390" height="150" rx="12" class="service"/>
  <circle cx="95" cy="547" r="14" fill="#77cbf5"/><text x="95" y="554" class="step">1</text>
  <text x="120" y="555" class="heading">API Gateway + Lambda</text>
  <text x="91" y="590" class="body">HTTP API + origin authorizer</text>
  <text x="91" y="624" class="small">Session cookies · CSRF · daily quotas</text>
  <text x="91" y="651" class="small">Accept, draw, poll and forget a reading</text>

  <path d="M458 591h119" class="request" marker-start="url(#blue-arrow)"/>
  <text x="476" y="572" class="small">Read/write</text>

  <rect x="577" y="518" width="789" height="150" rx="12" class="service"/>
  <text x="602" y="555" class="heading">Amazon DynamoDB</text>
  <text x="1050" y="555" class="small">On-demand · encrypted · TTL</text>
  <path d="M978 575v71" stroke="#425a76"/>
  <text x="602" y="593" class="body" font-weight="650">State table</text>
  <text x="602" y="622" class="small">Sessions, quotas, reading state</text>
  <text x="602" y="649" class="small">Spend limits + transactional outbox</text>
  <text x="1003" y="593" class="body" font-weight="650">Content table</text>
  <text x="1003" y="622" class="small">Questions and interpretations</text>
  <text x="1003" y="649" class="small">24-hour reading expiry</text>

  <path d="M740 668v66H233v55" class="async"/>
  <text x="357" y="712" class="small">DynamoDB Streams · outbox INSERT</text>
  <path d="M1194 789V668" class="async" marker-start="url(#purple-arrow)"/>
  <text x="1210" y="720" class="small">Read state;</text>
  <text x="1210" y="746" class="small">save result</text>

  <rect x="68" y="789" width="330" height="141" rx="12" class="service"/>
  <circle cx="95" cy="818" r="14" fill="#b9a0fa"/><text x="95" y="825" class="step">2</text>
  <text x="120" y="826" class="heading">Lambda Dispatcher</text>
  <text x="91" y="863" class="body">Outbox → queue</text>
  <text x="91" y="899" class="small">Queued after the third draw</text>

  <path d="M398 858h119" class="async"/>
  <text x="413" y="834" class="small">Reading ID</text>

  <rect x="517" y="789" width="335" height="141" rx="12" class="service"/>
  <circle cx="544" cy="818" r="14" fill="#b9a0fa"/><text x="544" y="825" class="step">3</text>
  <text x="569" y="826" class="heading">Amazon SQS</text>
  <text x="540" y="863" class="body">Reading jobs</text>
  <text x="540" y="899" class="small">Encrypted · reading IDs only</text>

  <path d="M852 858h169" class="async"/>
  <text x="892" y="834" class="small">Consume</text>

  <rect x="1021" y="789" width="345" height="141" rx="12" class="service"/>
  <circle cx="1048" cy="818" r="14" fill="#b9a0fa"/><text x="1048" y="825" class="step">4</text>
  <text x="1073" y="826" class="heading">Lambda Worker</text>
  <text x="1044" y="863" class="body">Generate + validate readings</text>
  <text x="1044" y="899" class="small">Idempotent jobs · concurrency ≤ 2</text>

  <circle cx="82" cy="972" r="6" fill="#77cbf5"/>
  <text x="101" y="979" class="body">The browser polls the API for status and the completed reading.</text>

  <!-- Supporting recovery and cross-region inference. -->
  <rect x="40" y="1032" width="690" height="240" rx="18" fill="#121b2d" stroke="#4c5479"/>
  <text x="68" y="1071" class="eyebrow">RETRY &amp; RECOVERY · THAILAND</text>
  <text x="68" y="1115" class="heading">EventBridge → Lambda Reconciler</text>
  <text x="68" y="1148" class="body">Requeue pending outbox jobs every five minutes;</text>
  <text x="68" y="1178" class="body">clean expired reading content.</text>
  <path d="M68 1196h633" stroke="#35425e"/>
  <text x="68" y="1234" class="body">SQS dead-letter queue retains failed jobs for review.</text>

  <rect x="768" y="1032" width="632" height="240" rx="18" fill="#221c38" stroke="#8270b0"/>
  <path d="M1194 930v102" class="async" marker-start="url(#purple-arrow)"/>
  <text x="1213" y="1018" class="small">Invoke / return</text>
  <text x="796" y="1071" class="eyebrow">03 / AI INFERENCE · UNITED STATES</text>
  <text x="796" y="1111" class="heading">Amazon Bedrock</text>
  <rect x="796" y="1131" width="171" height="69" rx="9" fill="#302642" stroke="#665184"/>
  <text x="881" y="1160" class="body" text-anchor="middle">Input</text>
  <text x="881" y="1186" class="small" text-anchor="middle">Guardrail</text>
  <path d="M967 1166h22" class="async"/>
  <rect x="991" y="1131" width="187" height="69" rx="9" fill="#3b2b55" stroke="#b9a0fa"/>
  <text x="1084" y="1160" class="body" text-anchor="middle">Amazon</text>
  <text x="1084" y="1186" class="body" text-anchor="middle" font-weight="650">Nova Micro</text>
  <path d="M1178 1166h21" class="async"/>
  <rect x="1202" y="1131" width="170" height="69" rx="9" fill="#302642" stroke="#665184"/>
  <text x="1287" y="1160" class="body" text-anchor="middle">Output</text>
  <text x="1287" y="1186" class="small" text-anchor="middle">Guardrail</text>
  <text x="796" y="1241" class="small">US inference profile · endpoint us-east-1</text>

  <!-- Cross-cutting controls are intentionally summarized, without account values. -->
  <rect x="40" y="1304" width="1360" height="143" rx="18" fill="#142324" stroke="#365e5b"/>
  <text x="68" y="1339" class="eyebrow">SECURITY &amp; OPERATIONS</text>
  <path d="M507 1359v67M994 1359v67" stroke="#365e5b"/>
  <text x="68" y="1374" class="body" font-weight="650">Secrets Manager + scoped IAM</text>
  <text x="68" y="1402" class="small">Server-only keys · daily network HMACs</text>
  <text x="68" y="1429" class="small">No raw IP or MAC stored in the database</text>
  <text x="533" y="1374" class="body" font-weight="650">CloudWatch → SNS alerts</text>
  <text x="533" y="1402" class="small">Logs, metrics, alarms and email subscription</text>
  <text x="533" y="1429" class="small">Player questions and answers stay out of logs</text>
  <text x="1021" y="1374" class="body" font-weight="650">AWS Budgets</text>
  <text x="1021" y="1402" class="small">US$10/month planning target</text>
  <text x="1021" y="1429" class="small">Alerts are not a spending cap</text>

  <text x="48" y="1480" class="small">Infrastructure as code: AWS CDK / TypeScript</text>
  <path d="M938 1473h37" stroke="#77cbf5" stroke-width="3"/>
  <text x="987" y="1480" class="small">Request / data</text>
  <path d="M1174 1473h37" stroke="#b9a0fa" stroke-width="3"/>
  <text x="1223" y="1480" class="small">Reading jobs</text>
</svg>
